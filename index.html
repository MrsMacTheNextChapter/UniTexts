<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mrs Mac Uni Texts</title><style>*{box-sizing:border-box}body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f0;color:#26342b;margin:0;padding:20px}main{max-width:600px;margin:auto}h1{font-size:25px}label{display:block;margin:12px 0 5px}textarea,select,input,button{font:inherit;border:1px solid #c5cbc0;border-radius:10px;padding:12px}textarea{width:100%;min-height:80px}button{background:#52654e;color:white;border:0;margin:6px 0;cursor:pointer}button.secondary{background:#e2e7df;color:#26342b}canvas{background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0 0/20px 20px;width:100%;height:auto;display:block;border-radius:12px;margin-top:15px}.entry{background:white;padding:12px;border-radius:12px;margin:10px 0}.entry select{max-width:70%}.remove{float:right}small{display:block;line-height:1.5}#status{color:#9b322a}</style><main><h1>Mrs Mac · Uni Texts 🩷</h1><p>Paste a student message, add a parent reply if needed, and save your slide to Photos.</p><label for="theme">Slide style</label><select id="theme"><option value="botanical">Pink botanical · WhatsApp</option><option value="white">Classic iPhone</option><option value="transparent">Transparent (video overlay)</option><option value="sage">Mrs Mac sage green</option></select><label><input type="checkbox" id="brand"> Include title and Mrs Mac signature</label><div id="entries"></div><button id="add">+ Add message</button> <button class="secondary" id="clear">Clear conversation</button><p id="status" role="status"></p><button id="save">Save slide (PNG)</button> <button id="share">Share / Save to Photos</button><small>Preview · 1080 × 1920. Large, readable message bubbles. Messages stay in this browser session; nothing is uploaded. Remove names and identifying details before sharing.</small><canvas id="preview" width="1080" height="1920"></canvas></main><script>
const $=id=>document.getElementById(id), c=$('preview'),ctx=c.getContext('2d');let valid=true;
function add(side='student',value=''){const d=document.createElement('div');d.className='entry';d.innerHTML='<select aria-label="Sender"><option value="student">Student (incoming)</option><option value="parent">Parent (reply)</option></select><button class="secondary remove" aria-label="Remove message">Remove</button><textarea placeholder="Type or paste message" aria-label="Message"></textarea>';d.querySelector('select').value=side;d.querySelector('textarea').value=value;d.querySelector('.remove').onclick=()=>{d.remove();draw()};d.oninput=draw;$('entries').append(d);draw()}
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function lines(t,max){let out=[];for(const para of t.split('\n')){let line='';for(const word of para.split(/\s+/)){if(ctx.measureText((line?line+' ':'')+word).width<=max){line+=(line?' ':'')+word}else{if(line)out.push(line);line='';for(const ch of word){if(ctx.measureText(line+ch).width>max){out.push(line);line=''}line+=ch}}}out.push(line)}return out}
function botanical(){ctx.fillStyle='#cf8995';ctx.fillRect(0,0,1080,1920);function leaf(x,y,a,w,h){ctx.save();ctx.translate(x,y);ctx.rotate(a);let g=ctx.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#173b30');g.addColorStop(.48,'#42634c');g.addColorStop(.55,'#254838');g.addColorStop(1,'#102e26');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-w*.72,-h*.25,-w*.58,-h*.72,0,-h);ctx.bezierCurveTo(w*.58,-h*.72,w*.72,-h*.25,0,0);ctx.fill();ctx.strokeStyle='#78907a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-w*.06,-h*.5,0,-h);ctx.stroke();ctx.globalAlpha=.24;ctx.lineWidth=2;for(let i=1;i<9;i++){let yy=-h*i/10,ww=w*.43*Math.sin(Math.PI*i/10);for(let sign of [-1,1]){ctx.beginPath();ctx.moveTo(0,yy+45);ctx.quadraticCurveTo(sign*ww*.5,yy-35,sign*ww,yy-80);ctx.stroke()}}ctx.restore()}leaf(170,1230,-.7,720,1450);leaf(100,1500,1.15,760,1300);leaf(650,1900,-.7,850,1450);leaf(1080,2100,.48,730,1400);leaf(40,2100,-.5,680,1000)}
function draw(){let bot=$('theme').value==='botanical',sage=$('theme').value==='sage',brand=$('brand').checked;ctx.clearRect(0,0,1080,1920);if($('theme').value!=='transparent'){ctx.fillStyle=sage?'#87947c':'#ffffff';ctx.fillRect(0,0,1080,1920);}if(bot)botanical();ctx.textAlign='center';ctx.fillStyle=(sage||bot)?'#fff':'#26342b';if(brand){ctx.font='bold 52px sans-serif';ctx.fillText('Texts from our uni kids',540,250);ctx.font='italic 48px Georgia';ctx.fillText('Mrs Mac ♡',540,1640)}let data=[...document.querySelectorAll('.entry')].map(e=>({side:e.querySelector('select').value,t:e.querySelector('textarea').value.trim()})).filter(e=>e.t);let blocks=[],total=0;for(let size=68;size>=48;size-=2){ctx.font=size+'px -apple-system, BlinkMacSystemFont, Arial, sans-serif';blocks=data.map(e=>{let ls=lines(e.t,790),w=Math.max(...ls.map(l=>ctx.measureText(l).width))+64;return {...e,ls,w,h:ls.length*(size+12)+48,size}});total=blocks.reduce((s,b)=>s+b.h+22,0);if(total<=1280)break}valid=total<=1280&&data.length>0;$('status').textContent=total>1280?'Too much text for one slide. Split this conversation into two slides.':data.length?'':'Add your first message to get started.';let y=Math.max(300,920-total/2);for(const b of blocks){let right=b.side==='parent',x=right?965-b.w:55;ctx.shadowColor=bot?'rgba(0,0,0,.20)':'transparent';ctx.shadowBlur=bot?12:0;ctx.shadowOffsetY=bot?5:0;round(x,y,b.w,b.h,43,bot?(right?'#e1f4ce':'#ffffff'):(right?'#32aaf5':'#e9e9eb'));ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.beginPath();let edge=right?x+b.w:x,dir=right?1:-1,base=y+b.h;ctx.moveTo(edge-dir*35,base-25);ctx.bezierCurveTo(edge-dir*5,base-8,edge+dir*3,base+8,edge+dir*17,base+10);ctx.bezierCurveTo(edge+dir*23,base+11,edge+dir*21,base+5,edge+dir*16,base+1);ctx.quadraticCurveTo(edge-dir*2,base-12,edge-dir*1,base-38);ctx.closePath();ctx.fill();ctx.fillStyle=right&&!bot?'white':'#171717';ctx.font=b.size+'px -apple-system, BlinkMacSystemFont, Arial, sans-serif';ctx.textAlign='left';b.ls.forEach((l,i)=>ctx.fillText(l,x+32,y+30+b.size+i*(b.size+12)));y+=b.h+22} $('save').disabled=$('share').disabled=!valid}
$('add').onclick=()=>add('student');$('clear').onclick=()=>{if(confirm('Clear all messages?')){$('entries').innerHTML='';add()}};$('theme').onchange=$('brand').onchange=draw;$('save').onclick=()=>{let a=document.createElement('a');a.download='Mrs-Mac-Uni-Texts.png';a.href=c.toDataURL('image/png');a.click()};$('share').onclick=()=>c.toBlob(async b=>{let f=new File([b],'Mrs-Mac-Uni-Texts.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else $('save').click()}catch(e){if(e.name!=='AbortError')$('save').click()}},'image/png');add('student');</script></html>
